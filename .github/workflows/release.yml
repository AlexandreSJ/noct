# Publishes a release when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0):
# runs the checks, builds the archives with make dist and creates the GitHub release, with the
# tag's section of CHANGELOG.md as its text. noct's updates read these releases.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The latest stable Go, not go.mod's minimum, so releases ship the newest standard library fixes.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable

      # The end-to-end tests run /bin/sh in panes and expect bash's line editing and job
      # control; Ubuntu's /bin/sh is dash.
      - name: Use bash as /bin/sh
        run: sudo ln -sf bash /bin/sh

      - name: Check (gofmt, vet, race tests)
        run: make check

      - name: Build the archives
        run: make dist VERSION="$GITHUB_REF_NAME"

      - name: Release notes from CHANGELOG.md
        run: make release-notes VERSION="$GITHUB_REF_NAME" > dist/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "noct $GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag $prerelease
